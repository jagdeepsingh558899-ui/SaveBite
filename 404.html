<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080b09"
  >

  <meta
    name="description"
    content="The SaveBite page you're looking for could not be found."
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Page Not Found — SaveBite</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    href="assets/icons/icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="assets/icons/icon-192.png"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --sb-bg: #080b09;
      --sb-surface: #101512;
      --sb-border: rgba(255, 255, 255, 0.08);

      --sb-green: #38d878;
      --sb-green-dark: #1ca85a;

      --sb-white: #ffffff;
      --sb-muted: #9ca7a0;

      --sb-font-body:
        "DM Sans",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      --sb-font-heading:
        "Plus Jakarta Sans",
        "DM Sans",
        system-ui,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--sb-bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(56, 216, 120, 0.12),
          transparent 42%
        ),
        var(--sb-bg);

      color: var(--sb-white);
      font-family: var(--sb-font-body);

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a,
    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: min(
        calc(100% - 32px),
        760px
      );

      margin: auto;

      padding:
        32px
        0
        calc(32px + env(safe-area-inset-bottom));

      text-align: center;
    }

    /* =========================================
       BRAND
    ========================================= */

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 70px;
    }

    .brand-mark {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          var(--sb-green),
          var(--sb-green-dark)
        );

      color: #031108;

      font-family: var(--sb-font-heading);
      font-size: 21px;
      font-weight: 800;

      box-shadow:
        0 12px 32px rgba(56, 216, 120, 0.16);
    }

    .brand-name {
      font-family: var(--sb-font-heading);
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-name span {
      color: var(--sb-green);
    }

    /* =========================================
       ERROR
    ========================================= */

    .error-code {
      margin: 0;

      color: var(--sb-green);

      font-family: var(--sb-font-heading);
      font-size: clamp(72px, 20vw, 150px);
      line-height: 0.9;
      font-weight: 800;

      letter-spacing: -7px;

      opacity: 0.95;
    }

    h1 {
      margin: 25px 0 0;

      font-family: var(--sb-font-heading);
      font-size: clamp(28px, 7vw, 48px);
      line-height: 1.08;
      letter-spacing: -1.5px;
    }

    .description {
      max-width: 530px;

      margin: 16px auto 0;

      color: var(--sb-muted);

      font-size: 15px;
      line-height: 1.7;
    }

    /* =========================================
       ACTIONS
    ========================================= */

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;

      max-width: 430px;

      margin: 30px auto 0;
    }

    .primary-button,
    .secondary-button {
      min-height: 52px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 0 20px;

      border-radius: 15px;

      font-size: 14px;
      font-weight: 800;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .primary-button {
      border: 1px solid transparent;

      background: var(--sb-green);
      color: #031108;
    }

    .primary-button:hover {
      transform: translateY(-1px);
      background: #4ee58b;
    }

    .secondary-button {
      border: 1px solid var(--sb-border);

      background: var(--sb-surface);
      color: var(--sb-white);
    }

    .secondary-button:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.16);
    }

    .primary-button svg,
    .secondary-button svg {
      width: 18px;
      height: 18px;
    }

    /* =========================================
       QUICK LINKS
    ========================================= */

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;

      margin-top: 32px;
    }

    .quick-links a {
      padding: 9px 12px;

      border: 1px solid var(--sb-border);
      border-radius: 10px;

      color: var(--sb-muted);

      font-size: 12px;
      font-weight: 700;

      background: rgba(16, 21, 18, 0.6);

      transition:
        color 0.2s ease,
        border-color 0.2s ease;
    }

    .quick-links a:hover {
      color: var(--sb-white);
      border-color: rgba(56, 216, 120, 0.25);
    }

    /* =========================================
       FOOTER
    ========================================= */

    .footer {
      margin-top: 70px;

      color: #68716c;

      font-size: 11px;
      line-height: 1.6;
    }

    .footer strong {
      color: #8d9891;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (min-width: 640px) {
      .page {
        width: min(
          calc(100% - 48px),
          760px
        );

        padding-top: 42px;
      }

      .brand {
        margin-bottom: 90px;
      }

      .actions {
        flex-direction: row;
        justify-content: center;
      }

      .primary-button,
      .secondary-button {
        min-width: 190px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- BRAND -->

    <a
      class="brand"
      href="index.html"
      aria-label="SaveBite home"
    >

      <span
        class="brand-mark"
        aria-hidden="true"
      >
        S
      </span>

      <span class="brand-name">
        Save<span>Bite</span>
      </span>

    </a>


    <!-- ERROR -->

    <p
      class="error-code"
      aria-hidden="true"
    >
      404
    </p>

    <h1>
      Looks like this bite is missing.
    </h1>

    <p class="description">
      The page you're looking for doesn't exist,
      may have moved, or is temporarily unavailable.
      Let's get you back to SaveBite.
    </p>


    <!-- ACTIONS -->

    <div class="actions">

      <a
        class="primary-button"
        href="index.html"
      >

        Go to Home

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="m5 12 4 4L19 6"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>

      </a>


      <a
        class="secondary-button"
        href="customer/deals.html"
      >

        Explore Deals

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path
            d="M5 12h14"
            stroke-linecap="round"
          ></path>

          <path
            d="m13 6 6 6-6 6"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>

      </a>

    </div>


    <!-- QUICK LINKS -->

    <nav
      class="quick-links"
      aria-label="SaveBite quick links"
    >

      <a href="auth/login.html">
        Login
      </a>

      <a href="auth/role.html?role=customer">
        Customer
      </a>

      <a href="auth/role.html?role=business">
        Business
      </a>

    </nav>


    <!-- FOOTER -->

    <footer class="footer">

      <div>
        <strong>SaveBite</strong>
        — Good Food. Better Price. Less Waste.
      </div>

      <div>
        © <span id="year"></span> SaveBite
      </div>

    </footer>

  </main>


  <script>
    "use strict";

    const yearElement =
      document.getElementById("year");

    if (yearElement) {
      yearElement.textContent =
        String(new Date().getFullYear());
    }
  </script>

</body>
</html>
